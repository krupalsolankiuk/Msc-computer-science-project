# Development overrides — Docker Compose automatically merges this file
# with docker-compose.yml when you run `docker compose up` (no extra
# flags needed, as long as both files are in the same directory).
# For a production-style run without hot-reload/pgAdmin, use:
#   docker compose -f docker-compose.yml up --build

services:
  api:
    volumes:
      - ./backend/app:/app/app        # live code reload
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      target: builder
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"

  pgadmin:
    image: dpage/pgadmin4
    container_name: checkin-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - checkin-net

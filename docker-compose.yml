services:
  db:
    image: postgres:16
    container_name: checkin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkin_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: hotel_checkin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkin_admin -d hotel_checkin"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - checkin-net

  api:
    build:
      context: ./backend
    container_name: checkin-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - checkin-net

  web:
    build:
      context: ./frontend
    container_name: checkin-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - checkin-net

volumes:
  pgdata:

networks:
  checkin-net:
    driver: bridge
